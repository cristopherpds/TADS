<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title th:text="${pageTitle}">Título Padrão</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <nav class="bg-white dark:bg-gray-700 shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a th:href="@{/}" class="text-xl font-semibold text-gray-800 dark:text-gray-200">Sistema de Cursos</a>
            <div class="flex space-x-4">
                <a th:href="@{/categorias}" class="text-gray-800 dark:text-gray-200 hover:text-blue-500">Categorias</a>
                <a th:href="@{/professores}" class="text-gray-800 dark:text-gray-200 hover:text-blue-500">Professores</a>
                <a th:href="@{/cursos}" class="text-gray-800 dark:text-gray-200 hover:text-blue-500">Cursos</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div layout:fragment="content"></div>
    </div>
</body>
</html>
