<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></title>
</head>
<body>
    <div layout:fragment="content">
        <h1 th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></h1>
        <form th:action="@{/categorias}" th:object="${categoria}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/categorias" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
