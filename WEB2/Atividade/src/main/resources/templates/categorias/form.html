<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div layout:fragment="content" class="max-w-7xl mx-auto p-6 ba">
        <h1 class="text-2xl font-semibold text-gray-900 mb-6" th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></h1>
        <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="bg-white shadow-md rounded-lg p-6">
            <input type="hidden" th:field="*{id}">
            <div class="grid grid-cols-1">
                <div class="mb-4">
                    <label for="nome" class="block text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="nome" th:field="*{nome}" required>
                    <div th:if="${#fields.hasErrors('nome')}" class="text-red-500 text-sm mt-1">
                        <p th:errors="*{nome}">Nome inválido</p>
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-4">
                <a href="/categorias" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
