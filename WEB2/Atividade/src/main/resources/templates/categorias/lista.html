<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Lista de Categorias</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Lista de Categorias</h1>
        <a href="/categorias/novo" class="btn btn-primary mb-3">Nova Categoria</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.id}"></td>
                    <td th:text="${categoria.nome}"></td>
                    <td>
                        <a th:href="@{/categorias/{id}/editar(id=${categoria.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:href="@{/categorias/{id}/excluir(id=${categoria.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir esta categoria?')">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
