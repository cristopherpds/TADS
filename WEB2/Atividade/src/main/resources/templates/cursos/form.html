<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${curso.id == null ? 'Novo Curso' : 'Editar Curso'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div layout:fragment="content" class="max-w-7xl mx-auto p-6 bg-gray-200">
        <h1 class="text-2xl font-semibold text-gray-900" th:text="${curso.id == null ? 'Novo Curso' : 'Editar Curso'}"></h1>
        <form th:action="@{/cursos}" th:object="${curso}" method="post" enctype="multipart/form-data" class="mt-8 space-y-6">
            <input type="hidden" th:field="*{id}">
            <div class="grid grid-cols-1 gap-6">
                <div>
                    <label for="nome" class="block text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="nome" th:field="*{nome}" required>
                </div>
                <div>
                    <label for="descricao" class="block text-sm font-medium text-gray-700">Descrição</label>
                    <textarea class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="descricao" th:field="*{descricao}" rows="3" required></textarea>
                </div>
                <div>
                    <label for="dataInicio" class="block text-sm font-medium text-gray-700">Data de Início</label>
                    <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="dataInicio" th:field="*{dataInicio}" required>
                </div>
                <div>
                    <label for="dataFinal" class="block text-sm font-medium text-gray-700">Data Final</label>
                    <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="dataFinal" th:field="*{dataFinal}" required>
                </div>
                <div>
                    <label for="professor" class="block text-sm font-medium text-gray-700">Professor</label>
                    <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="professor" th:field="*{professor.id}" required>
                        <option value="">Selecione um professor</option>
                        <option th:each="prof : ${professores}" th:value="${prof.id}" th:text="${prof.nome}"></option>
                    </select>
                </div>
                <div>
                    <label for="categoria" class="block text-sm font-medium text-gray-700">Categoria</label>
                    <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" id="categoria" th:field="*{categoria.id}" required>
                        <option value="">Selecione uma categoria</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                    </select>
                </div>
                <div>
                    <label for="imagem" class="block text-sm font-medium text-gray-700">Imagem</label>
                    <input type="file" id="imagem" name="imagemFile"
                           class="mt-1 block w-full text-sm text-gray-500
                                  file:mr-4 file:py-2 file:px-4
                                  file:rounded-md file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-indigo-50 file:text-indigo-700
                                  hover:file:bg-indigo-100">
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <a href="/cursos" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-gray-600 hover:bg-gray-700">Cancelar</a>
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
