<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${curso.id == null ? 'Novo Curso' : 'Editar Curso'}"></title>
</head>
<body>
    <div layout:fragment="content">
        <h1 th:text="${curso.id == null ? 'Novo Curso' : 'Editar Curso'}"></h1>
        <form th:action="@{/cursos}" th:object="${curso}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="dataInicio">Data de Início</label>
                <input type="date" class="form-control" id="dataInicio" th:field="*{dataInicio}" required>
            </div>
            <div class="form-group">
                <label for="dataFinal">Data Final</label>
                <input type="date" class="form-control" id="dataFinal" th:field="*{dataFinal}" required>
            </div>
            <div class="form-group">
                <label for="professor">Professor</label>
                <select class="form-control" id="professor" th:field="*{professor.id}" required>
                    <option value="">Selecione um professor</option>
                    <option th:each="prof : ${professores}" th:value="${prof.id}" th:text="${prof.nome}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select class="form-control" id="categoria" th:field="*{categoria.id}" required>
                    <option value="">Selecione uma categoria</option>
                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="imagem">Imagem</label>
                <input type="file" class="form-control-file" id="imagem" name="imagemFile">
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/cursos" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
