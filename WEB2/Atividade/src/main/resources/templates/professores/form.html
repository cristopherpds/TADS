<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${professor.id == null ? 'Novo Professor' : 'Editar Professor'}"></title>
</head>
<body>
    <div layout:fragment="content">
        <h1 th:text="${professor.id == null ? 'Novo Professor' : 'Editar Professor'}"></h1>
        <form th:action="@{/professores}" th:object="${professor}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label for="foto">Foto</label>
                <input type="file" class="form-control-file" id="foto" name="fotoFile">
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/professores" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
