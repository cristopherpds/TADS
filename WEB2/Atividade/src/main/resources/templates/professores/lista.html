<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Lista de Professores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div layout:fragment="content" class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-6">Lista de Professores</h1>
        <a th:href="@{/professores/novo}" class="inline-block mb-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Novo Professor</a>
        <ul role="list" class="divide-y divide-gray-200">
            <li th:each="professor : ${paginaProfessores.content}" class="flex justify-between gap-x-6 py-5">
                <div class="flex min-w-0 gap-x-4">
                    <img th:if="${professor.foto}"
                         th:src="@{'/uploads/' + ${professor.foto}}"
                         alt="Imagem do Professor"
                         class="h-12 w-12 flex-none rounded-full bg-gray-50">
                    <div class="min-w-0 flex-auto">
                        <p class="text-sm font-semibold text-gray-900" th:text="${professor.nome}">Nome do Professor</p>
                        <p class="mt-1 truncate text-xs text-gray-500" th:text="${professor.email}">email@example.com</p>
                    </div>
                </div>
                <div class="flex flex-col items-end">
                    <div class="flex space-x-2">
                        <a th:href="@{/professores/{id}/editar(id=${professor.id})}"
                           class="px-3 py-1 text-sm bg-green-500 text-white rounded hover:bg-green-600">Editar</a> 
                        <form th:action="@{/professores/{id}/excluir(id=${professor.id})}" method="post" style="display:inline;">
                            <button type="submit"
                                    class="px-3 py-1 text-sm bg-red-500 text-white rounded hover:bg-red-600"
                                    onclick="return confirm('Tem certeza que deseja excluir este professor?')">
                                Excluir
                            </button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>

        <!-- Controles de Paginação -->
        <div class="mt-6 flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-700">
                    Página <span th:text="${paginaProfessores.number + 1}"></span> de <span th:text="${paginaProfessores.totalPages}"></span>
                </p>
            </div>
            <div class="flex space-x-2">
                <a th:if="${paginaProfessores.hasPrevious()}" 
                   th:href="@{/professores(page=${paginaProfessores.number - 1})}" 
                   class="px-3 py-1 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">Anterior</a>
                <a th:if="${paginaProfessores.hasNext()}" 
                   th:href="@{/professores(page=${paginaProfessores.number + 1})}" 
                   class="px-3 py-1 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">Próximo</a>
            </div>
        </div>
    </div>
</body>
</html>
