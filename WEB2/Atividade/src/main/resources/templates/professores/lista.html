<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Lista de Professores</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Lista de Professores</h1>
        <a href="/professores/novo" class="btn btn-primary mb-3">Novo Professor</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="professor : ${professores}">
                    <td th:text="${professor.id}"></td>
                    <td th:text="${professor.nome}"></td>
                    <td th:text="${professor.email}"></td>
                    <td>
                        <img th:if="${professor.foto}" th:src="@{'/uploads/' + ${professor.foto}}" alt="Imagem do Professor" style="max-width: 100px;">
                    </td>
                    <td>
                        <a th:href="@{/professores/{id}/editar(id=${professor.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:href="@{/professores/{id}/excluir(id=${professor.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir este professor?')">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
